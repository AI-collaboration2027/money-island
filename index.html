<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>小小財富島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 佈局：全螢幕 3D 小島在底層，頂部 HUD、底部指令列、點建築或按鈕開啟底部抽屜 */
:root {
  --sea: #12343B; --sea2: #1D4C56; --sand: #FFF6DC; --paper: #FFFDF5; --ink: #12343B; --ink2: #4A6A70;
  --coin: #FFC83D; --coral: #EF5B4B; --mint: #34A86B; --sky: #4F7CF0; --line: #E6DCBF; --good: #1F9D5C; --bad: #D9453A;
  --display: 'Huninn', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --body: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: #BFE6F3; color: var(--ink); font-family: var(--body); font-size: 16px; overflow: hidden; touch-action: manipulation; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
#app { position: fixed; inset: 0; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.pad { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }

/* HUD */
#hud { position: absolute; left: 0; right: 0; top: 0; padding-top: 8px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.hudrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: stretch; }
.chip { pointer-events: auto; background: var(--paper); border-radius: 14px; padding: 5px 10px; box-shadow: 0 2px 0 rgba(18,52,59,.18); display: flex; align-items: center; gap: 6px; min-height: 40px; }
.chip b { font-family: var(--display); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.chip small { color: var(--ink2); font-size: .72rem; line-height: 1.1; display: block; }
.coin { width: 18px; height: 18px; border-radius: 50%; background: var(--coin); box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); flex: none; }
.coin.b { background: var(--sky); } .coin.n { background: var(--mint); }
.date { font-family: var(--display); background: var(--sea); color: #fff; }
.date small { color: #BDE3E8; }
.bar { width: 64px; height: 8px; border-radius: 8px; background: #E9E1C8; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--mint); border-radius: 8px; transition: width .3s; }
.bar.joy i { background: var(--coral); }
.ap { display: flex; gap: 4px; }
.ap i { width: 14px; height: 14px; border-radius: 50%; background: var(--coin); box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }
.ap i.off { background: #E1D8BC; box-shadow: none; }
.me { cursor: pointer; }
.hero-av { width: 28px; height: 28px; border-radius: 50%; flex: none; }
#tipbar { pointer-events: auto; align-self: flex-start; max-width: min(440px, 100%); background: var(--sea); color: #fff; border-radius: 16px; padding: 8px 12px; font-size: .92rem; line-height: 1.45; display: flex; gap: 8px; align-items: center; box-shadow: 0 3px 0 rgba(0,0,0,.2); }
#tipbar .owl { font-family: var(--display); background: var(--coin); color: var(--sea); border-radius: 50%; width: 30px; height: 30px; flex: none; display: grid; place-items: center; font-size: .9rem; }

/* 地圖標籤 */
#pins { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.pin { position: absolute; left: 0; top: 0; pointer-events: auto; transform: translate(-50%, -100%); background: var(--paper); border-radius: 12px; padding: 4px 9px; font-weight: 700; font-size: .82rem; white-space: nowrap; box-shadow: 0 2px 0 rgba(18,52,59,.25); display: flex; align-items: center; gap: 5px; will-change: transform; }
.pin.go { background: var(--coin); animation: bob 1.4s ease-in-out infinite; }
.pin.lock { background: #DDE5E6; color: #6B8286; }
.pin .lv { background: var(--sea); color: #fff; border-radius: 8px; padding: 0 6px; font-size: .72rem; }
@keyframes bob { 50% { margin-top: -4px; } }
body.flat #pins { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-content: center; padding: 90px 16px 120px; background: linear-gradient(#BFE6F3, #7CD6C8); }
body.flat .pin { position: static; transform: none !important; font-size: 1rem; padding: 12px 16px; }

/* 底部指令 */
#dock { position: absolute; left: 0; right: 0; bottom: 0; padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; justify-content: center; pointer-events: none; flex-wrap: wrap; }
.act { pointer-events: auto; background: var(--paper); border-radius: 16px; padding: 7px 10px 6px; min-width: 62px; display: flex; flex-direction: column; align-items: center; gap: 1px; box-shadow: 0 3px 0 rgba(18,52,59,.22); font-weight: 700; font-size: .82rem; }
.act:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(18,52,59,.22); }
.act svg { width: 26px; height: 26px; }
.act small { font-weight: 500; color: var(--ink2); font-size: .68rem; }
.act:disabled { opacity: .45; cursor: not-allowed; }
.act.end { background: var(--coral); color: #fff; } .act.end small { color: #FFE0DB; }

/* 抽屜與彈窗 */
#veil { z-index: 12; position: absolute; inset: 0; background: rgba(10,35,40,.45); display: none; align-items: flex-end; justify-content: center; }
#veil.on { display: flex; }
#veil.center { align-items: center; }
.sheet { background: var(--paper); width: min(560px, 100%); max-height: 88%; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 16px 16px max(18px, env(safe-area-inset-bottom, 0px)); position: relative; animation: up .22s ease-out; }
#veil.center .sheet { border-radius: 22px; max-height: 92%; margin: 0 12px; }
@keyframes up { from { transform: translateY(30px); opacity: .4; } }
.sheet h2 { font-family: var(--display); font-size: 1.45rem; margin: 0 28px 6px 0; line-height: 1.25; text-wrap: balance; }
.sheet h3 { font-family: var(--display); font-size: 1.05rem; margin: 14px 0 6px; }
.sheet p { margin: 6px 0; line-height: 1.65; }
.x { position: absolute; right: 10px; top: 10px; width: 36px; height: 36px; border-radius: 50%; background: #F1E9CF; font-size: 1.2rem; font-weight: 700; }
.sub { color: var(--ink2); font-size: .9rem; }
.btn { background: var(--sea); color: #fff; border-radius: 14px; padding: 10px 16px; font-weight: 700; box-shadow: 0 3px 0 rgba(0,0,0,.25); min-height: 44px; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.btn.coin2 { background: var(--coin); color: var(--sea); } .btn.red { background: var(--coral); } .btn.green { background: var(--mint); }
.btn.ghost { background: #F1E9CF; color: var(--ink); box-shadow: 0 3px 0 rgba(0,0,0,.1); }
.btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
.btn.sm { padding: 6px 11px; min-height: 36px; font-size: .88rem; border-radius: 11px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.sp { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.card { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; min-width: 0; }
.card.sel { border-color: var(--sea); background: #EAF7F5; }
.card.dim { opacity: .55; }
table.t { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.t td { padding: 5px 2px; border-bottom: 1px dashed var(--line); } .t td:last-child { text-align: right; font-weight: 700; }
.t tr.total td { border-bottom: 0; border-top: 2px solid var(--ink); font-size: 1.05rem; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.know { background: #FFF3C4; border-radius: 14px; padding: 10px 12px; margin-top: 10px; line-height: 1.6; }
.know b { font-family: var(--display); display: block; margin-bottom: 2px; }
.opt { display: block; width: 100%; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 11px 12px; margin: 7px 0; font-weight: 500; }
.opt:hover:not(:disabled) { border-color: var(--sea); }
.opt small { display: block; color: var(--ink2); font-weight: 400; font-size: .84rem; }
.opt.right { background: #DDF3E6; border-color: var(--good); } .opt.wrong { background: #FBE0DC; border-color: var(--bad); }
.opt:disabled { cursor: default; }
.stars { color: var(--coin); letter-spacing: 2px; font-size: 1.1rem; text-shadow: 0 1px 0 rgba(0,0,0,.2); } .stars .off { color: #E1D8BC; text-shadow: none; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 7px 4px; font-weight: 700; font-size: .88rem; }
.seg button.on { background: var(--sea); color: #fff; border-color: var(--sea); }
.seg small { display: block; font-weight: 500; font-size: .74rem; opacity: .85; }
.badge { width: 100%; display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 12px; background: #fff; border: 2px solid var(--line); }
.badge.off { opacity: .45; filter: grayscale(1); }
.badge i { width: 28px; height: 28px; border-radius: 50%; background: var(--coin); flex: none; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
.spark { width: 100%; height: 44px; display: block; }
.risk { display: inline-flex; gap: 3px; vertical-align: middle; } .risk i { width: 9px; height: 9px; border-radius: 50%; background: #E1D8BC; } .risk i.on { background: var(--coral); }
.ico { width: 44px; height: 44px; border-radius: 14px; background: var(--coin); display: grid; place-items: center; flex: none; }
.ico svg { width: 28px; height: 28px; stroke: var(--sea); }
.ico.bad { background: #FFC2BA; } .ico.good { background: #BDEBD0; } .ico.blue { background: #C9D7FF; }

/* 標題畫面 */
#title { z-index: 10; position: absolute; inset: 0; background: linear-gradient(#8ED7EF 0%, #BFE6F3 55%, #F6E3AE 100%); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; text-align: center; overflow-y: auto; }
#title.on { display: flex; }
#title h1 { font-family: var(--display); font-size: clamp(2.4rem, 10vw, 4rem); margin: 0; letter-spacing: .08em; color: var(--sea); text-shadow: 0 4px 0 #fff; line-height: 1.1; }
#title p { margin: 0; max-width: 28em; line-height: 1.6; }
#title input { font: inherit; font-size: 1.1rem; text-align: center; padding: 10px; border-radius: 14px; border: 3px solid var(--sea); width: 12em; background: #fff; color: var(--ink); }
.hats { display: flex; gap: 10px; }
.hats button { width: 46px; height: 46px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,.2); }
.hats button.on { border-color: var(--sea); transform: scale(1.12); }
#toasts { position: absolute; left: 50%; transform: translateX(-50%); top: max(6px, env(safe-area-inset-top, 0px)); z-index: 20; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; z-index: 5; width: min(420px, 92%); }
.toast { background: var(--sea); color: #fff; border-radius: 14px; padding: 8px 14px; font-weight: 700; box-shadow: 0 3px 0 rgba(0,0,0,.25); animation: tin .25s ease-out; text-align: center; }
.toast.badge { background: var(--coin); color: var(--sea); } .toast.level, .toast.dream { background: var(--mint); }
@keyframes tin { from { transform: translateY(-14px) scale(.9); opacity: 0; } }
@media (max-width: 520px) { .chip small { display: none; } .chip { padding: 4px 8px; min-height: 36px; }  .act { min-width: 54px; padding: 6px 7px 5px; font-size: .76rem; } .act small { display: none; } }
.sel, .inp { font: inherit; padding: 8px 10px; border-radius: 12px; border: 2px solid var(--line); background: #fff; color: var(--ink); width: 100%; min-height: 42px; }
.sel { margin-top: 3px; } .inp { margin-top: 3px; }
#gov { position: absolute; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; padding: 16px; background: linear-gradient(#0D2430, #1D4C56); overflow-y: auto; }
#gov.on { display: flex; }
.gcard { background: var(--paper); border-radius: 22px; padding: 22px 18px; width: min(460px, 100%); text-align: center; max-height: 100%; overflow-y: auto; }
.gcard h2 { font-family: var(--display); margin: 8px 0; text-wrap: balance; }
.moon { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 6px; background: #FFE9A8; box-shadow: inset -14px -6px 0 #F4D26A, 0 0 0 8px rgba(255,233,168,.25); }
.eye { width: 72px; height: 36px; margin: 0 auto 8px; border-radius: 50%; background: #fff; border: 4px solid var(--sea); position: relative; }
.eye::after { content: ""; position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px; border-radius: 50%; background: var(--sea); }
.av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--display); font-size: 1.1rem; flex: none; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.say { font-size: 1.2rem; line-height: 1.85; margin: 8px 0 10px; min-height: 5.5em; }
.dots { display: flex; gap: 6px; } .dots i { width: 8px; height: 8px; border-radius: 50%; background: #E1D8BC; } .dots i.on { background: var(--sea); }
.trait { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 3px 0; font-weight: 700; }
.tb { display: flex; gap: 3px; } .tb i { width: 14px; height: 14px; border-radius: 4px; background: #E9E1C8; } .tb i.on { background: var(--mint); }

/* ---- 介面細節美化 ---- */
.chip { background: linear-gradient(#FFFFFF, #FFF8E4); border: 2px solid rgba(255,255,255,.9); box-shadow: 0 3px 0 rgba(18,52,59,.16), 0 8px 18px rgba(18,52,59,.12); }
.chip.date { background: linear-gradient(#1D4C56, #12343B); border-color: rgba(255,255,255,.25); }
.btn { background: linear-gradient(#1F5360, #12343B); box-shadow: 0 3px 0 rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.2); letter-spacing: .02em; }
.btn.coin2 { background: linear-gradient(#FFD968, #FFC83D); box-shadow: 0 3px 0 #C99410, inset 0 1px 0 rgba(255,255,255,.6); }
.btn.green { background: linear-gradient(#45BF80, #2B9A63); } .btn.red { background: linear-gradient(#F57A6C, #E0453A); }
.btn.ghost { background: linear-gradient(#FFFFFF, #F1E9CF); }
.card { background: linear-gradient(#FFFFFF, #FFFCF2); box-shadow: 0 2px 0 rgba(18,52,59,.06); }
.know { background: linear-gradient(#FFF6CF, #FFEEA8); border: 2px solid #F6DD84; }
.opt { box-shadow: 0 2px 0 rgba(18,52,59,.07); }
.pin { background: linear-gradient(#FFFFFF, #FFF8E4); border: 2px solid rgba(255,255,255,.9); box-shadow: 0 3px 0 rgba(18,52,59,.18), 0 6px 14px rgba(18,52,59,.14); }
.pin.go { background: linear-gradient(#FFD968, #FFC83D); }
#title { background: radial-gradient(circle at 20% 15%, #FFFFFF 0, rgba(255,255,255,0) 28%), radial-gradient(circle at 85% 70%, #FFE9A8 0, rgba(255,233,168,0) 35%), linear-gradient(#7FD0EC 0%, #BFE6F3 55%, #F6E3AE 100%); }
#title h1 { text-shadow: 0 4px 0 #fff, 0 10px 24px rgba(18,52,59,.18); }
.toast { box-shadow: 0 3px 0 rgba(0,0,0,.22), 0 8px 18px rgba(18,52,59,.18); }
#dock .btn, #dock button { box-shadow: 0 3px 0 rgba(18,52,59,.2), 0 8px 16px rgba(18,52,59,.14); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

/* 付錢：先現金、再存款、不夠就被迫借款 */
function pay(amt) {
  var r = { cash: 0, bank: 0, loan: 0 }, need = amt, c = Math.min(S.cash, need);
  S.cash -= c; need -= c; r.cash = c;
  var b = Math.min(S.bank, need); S.bank -= b; need -= b; r.bank = b;

}
function payNoLoan(amt) { var c = Math.min(S.cash, amt); S.cash -= c; var b = Math.min(S.bank, amt - c); S.bank -= b; return c + b; }

  showSheet('<h2>家長專區</h2><h3>遊戲時間</h3><div class="row" style="align-items:flex-end;gap:2px">' + bars + '</div><p class="sub">單位：分鐘，近 7 天。紅色代表超過每日上限。</p>' +
    '<div class="card"><label class="sub" style="display:block">每日上限<select id="s-l" class="sel">' + [20, 30, 40, 60, 90].map(function (v) { return opt(v, s.limit, function (x) { return x + ' 分鐘'; }); }).join('') + '</select></label>' +
    '<div class="grid2" style="margin-top:8px"><label class="sub">就寢開始<select id="s-bs" class="sel">' + [19, 20, 21, 22, 23].map(function (v) { return opt(v * 60, s.bedStart, hh); }).join('') + '</select></label><label class="sub">早上開放<select id="s-be" class="sel">' + [5, 6, 7, 8].map(function (v) { return opt(v * 60, s.bedEnd, hh); }).join('') + '</select></label></div>' +
    '<label class="sub" style="display:block;margin-top:8px">每玩多久提醒休息<select id="s-b" class="sel">' + [10, 15, 20, 30].map(function (v) { return opt(v, s.breakEvery, function (x) { return x + ' 分鐘'; }); }).join('') + '</select></label><div class="row" style="margin-top:10px"><button class="btn sm coin2" id="s-save">儲存設定</button></div></div>' +
    '<h3>學習與決策報告</h3>' + rep + '<div class="know"><b>這個遊戲的設計</b>沒有每日登入獎勵、沒有連續天數壓力、沒有抽獎，也沒有任何付費。每一章有明確的結束點，時間到了島上就會「打烊」。</div>' +
    '<div class="row" style="margin-top:10px"><button class="btn sm ghost" id="s-pin">更改家長密碼</button></div>', true);
  $('#s-save').onclick = async function () { Guard.update({ limit: +$('#s-l').value, bedStart: +$('#s-bs').value, bedEnd: +$('#s-be').value, breakEvery: +$('#s-b').value }); if (Cloud.loggedIn()) await Cloud.saveSettings({ guard: Guard.exportSettings() }); say('已儲存'); };
  $('#s-pin').onclick = parentSetPin;
}
$('#parent').onclick = function () { sfx(); openParent(); };

/* ---- 啟動 ---- */
G.newGame('小店長', 0); hatsUi(); pinsInit();
var ok = false; try { ok = World.init($('#scene'), pick); } catch (e) { ok = false; }
if (ok) { World.onFrame = pinsFrame; } else { document.body.classList.add('flat'); $('#scene').style.display = 'none'; }
$('#pins').style.display = 'none'; $('#cont').hidden = !loadSave(); $('#undo').hidden = !loadBak();
titleInfo(); Cloud.init().then(function () { titleInfo(); if (Cloud.loggedIn()) Cloud.pullPlay(Guard.today()).then(function (x) { if (x) Guard.mergeUsed(x); }); });
})();
</script>
