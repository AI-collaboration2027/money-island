<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>小小財富島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 佈局：全螢幕 3D 小島在底層，頂部 HUD、底部指令列、點建築或按鈕開啟底部抽屜 */
:root {
  --sea: #12343B; --sea2: #1D4C56; --sand: #FFF6DC; --paper: #FFFDF5; --ink: #12343B; --ink2: #4A6A70;
  --coin: #FFC83D; --coral: #EF5B4B; --mint: #34A86B; --sky: #4F7CF0; --line: #E6DCBF; --good: #1F9D5C; --bad: #D9453A;
  --display: 'Huninn', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --body: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: #BFE6F3; color: var(--ink); font-family: var(--body); font-size: 16px; overflow: hidden; touch-action: manipulation; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
#app { position: fixed; inset: 0; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.pad { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }

/* HUD */
#hud { position: absolute; left: 0; right: 0; top: 0; padding-top: 8px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.hudrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: stretch; }
.chip { pointer-events: auto; background: var(--paper); border-radius: 14px; padding: 5px 10px; box-shadow: 0 2px 0 rgba(18,52,59,.18); display: flex; align-items: center; gap: 6px; min-height: 40px; }
.chip b { font-family: var(--display); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.chip small { color: var(--ink2); font-size: .72rem; line-height: 1.1; display: block; }
.coin { width: 18px; height: 18px; border-radius: 50%; background: var(--coin); box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); flex: none; }
.coin.b { background: var(--sky); } .coin.n { background: var(--mint); }
.date { font-family: var(--display); background: var(--sea); color: #fff; }
.date small { color: #BDE3E8; }
.bar { width: 64px; height: 8px; border-radius: 8px; background: #E9E1C8; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--mint); border-radius: 8px; transition: width .3s; }
.bar.joy i { background: var(--coral); }
.ap { display: flex; gap: 4px; }
.ap i { width: 14px; height: 14px; border-radius: 50%; background: var(--coin); box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }
.ap i.off { background: #E1D8BC; box-shadow: none; }
.me { cursor: pointer; }
.hero-av { width: 28px; height: 28px; border-radius: 50%; flex: none; }
#tipbar { pointer-events: auto; align-self: flex-start; max-width: min(440px, 100%); background: var(--sea); color: #fff; border-radius: 16px; padding: 8px 12px; font-size: .92rem; line-height: 1.45; display: flex; gap: 8px; align-items: center; box-shadow: 0 3px 0 rgba(0,0,0,.2); }
#tipbar .owl { font-family: var(--display); background: var(--coin); color: var(--sea); border-radius: 50%; width: 30px; height: 30px; flex: none; display: grid; place-items: center; font-size: .9rem; }

/* 地圖標籤 */
#pins { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.pin { position: absolute; left: 0; top: 0; pointer-events: auto; transform: translate(-50%, -100%); background: var(--paper); border-radius: 12px; padding: 4px 9px; font-weight: 700; font-size: .82rem; white-space: nowrap; box-shadow: 0 2px 0 rgba(18,52,59,.25); display: flex; align-items: center; gap: 5px; will-change: transform; }
.pin.go { background: var(--coin); animation: bob 1.4s ease-in-out infinite; }
.pin.lock { background: #DDE5E6; color: #6B8286; }
.pin .lv { background: var(--sea); color: #fff; border-radius: 8px; padding: 0 6px; font-size: .72rem; }
@keyframes bob { 50% { margin-top: -4px; } }
body.flat #pins { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-content: center; padding: 90px 16px 120px; background: linear-gradient(#BFE6F3, #7CD6C8); }
body.flat .pin { position: static; transform: none !important; font-size: 1rem; padding: 12px 16px; }

/* 底部指令 */
#dock { position: absolute; left: 0; right: 0; bottom: 0; padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; justify-content: center; pointer-events: none; flex-wrap: wrap; }
.act { pointer-events: auto; background: var(--paper); border-radius: 16px; padding: 7px 10px 6px; min-width: 62px; display: flex; flex-direction: column; align-items: center; gap: 1px; box-shadow: 0 3px 0 rgba(18,52,59,.22); font-weight: 700; font-size: .82rem; }
.act:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(18,52,59,.22); }
.act svg { width: 26px; height: 26px; }
.act small { font-weight: 500; color: var(--ink2); font-size: .68rem; }
.act:disabled { opacity: .45; cursor: not-allowed; }
.act.end { background: var(--coral); color: #fff; } .act.end small { color: #FFE0DB; }

/* 抽屜與彈窗 */
#veil { position: absolute; inset: 0; background: rgba(10,35,40,.45); display: none; align-items: flex-end; justify-content: center; }
#veil.on { display: flex; }
#veil.center { align-items: center; }
.sheet { background: var(--paper); width: min(560px, 100%); max-height: 88%; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 16px 16px max(18px, env(safe-area-inset-bottom, 0px)); position: relative; animation: up .22s ease-out; }
#veil.center .sheet { border-radius: 22px; max-height: 92%; margin: 0 12px; }
@keyframes up { from { transform: translateY(30px); opacity: .4; } }
.sheet h2 { font-family: var(--display); font-size: 1.45rem; margin: 0 28px 6px 0; line-height: 1.25; text-wrap: balance; }
.sheet h3 { font-family: var(--display); font-size: 1.05rem; margin: 14px 0 6px; }
.sheet p { margin: 6px 0; line-height: 1.65; }
.x { position: absolute; right: 10px; top: 10px; width: 36px; height: 36px; border-radius: 50%; background: #F1E9CF; font-size: 1.2rem; font-weight: 700; }
.sub { color: var(--ink2); font-size: .9rem; }
.btn { background: var(--sea); color: #fff; border-radius: 14px; padding: 10px 16px; font-weight: 700; box-shadow: 0 3px 0 rgba(0,0,0,.25); min-height: 44px; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.btn.coin2 { background: var(--coin); color: var(--sea); } .btn.red { background: var(--coral); } .btn.green { background: var(--mint); }
.btn.ghost { background: #F1E9CF; color: var(--ink); box-shadow: 0 3px 0 rgba(0,0,0,.1); }
.btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
.btn.sm { padding: 6px 11px; min-height: 36px; font-size: .88rem; border-radius: 11px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.sp { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.card { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; min-width: 0; }
.card.sel { border-color: var(--sea); background: #EAF7F5; }
.card.dim { opacity: .55; }
table.t { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.t td { padding: 5px 2px; border-bottom: 1px dashed var(--line); } .t td:last-child { text-align: right; font-weight: 700; }
.t tr.total td { border-bottom: 0; border-top: 2px solid var(--ink); font-size: 1.05rem; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.know { background: #FFF3C4; border-radius: 14px; padding: 10px 12px; margin-top: 10px; line-height: 1.6; }
.know b { font-family: var(--display); display: block; margin-bottom: 2px; }
.opt { display: block; width: 100%; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 11px 12px; margin: 7px 0; font-weight: 500; }
.opt:hover:not(:disabled) { border-color: var(--sea); }
.opt small { display: block; color: var(--ink2); font-weight: 400; font-size: .84rem; }
.opt.right { background: #DDF3E6; border-color: var(--good); } .opt.wrong { background: #FBE0DC; border-color: var(--bad); }
.opt:disabled { cursor: default; }
.stars { color: var(--coin); letter-spacing: 2px; font-size: 1.1rem; text-shadow: 0 1px 0 rgba(0,0,0,.2); } .stars .off { color: #E1D8BC; text-shadow: none; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 7px 4px; font-weight: 700; font-size: .88rem; }
.seg button.on { background: var(--sea); color: #fff; border-color: var(--sea); }
.seg small { display: block; font-weight: 500; font-size: .74rem; opacity: .85; }
.badge { width: 100%; display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 12px; background: #fff; border: 2px solid var(--line); }
.badge.off { opacity: .45; filter: grayscale(1); }
.badge i { width: 28px; height: 28px; border-radius: 50%; background: var(--coin); flex: none; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
.spark { width: 100%; height: 44px; display: block; }
.risk { display: inline-flex; gap: 3px; vertical-align: middle; } .risk i { width: 9px; height: 9px; border-radius: 50%; background: #E1D8BC; } .risk i.on { background: var(--coral); }
.ico { width: 44px; height: 44px; border-radius: 14px; background: var(--coin); display: grid; place-items: center; flex: none; }
.ico svg { width: 28px; height: 28px; stroke: var(--sea); }
.ico.bad { background: #FFC2BA; } .ico.good { background: #BDEBD0; } .ico.blue { background: #C9D7FF; }

/* 標題畫面 */
#title { position: absolute; inset: 0; background: linear-gradient(#8ED7EF 0%, #BFE6F3 55%, #F6E3AE 100%); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; text-align: center; overflow-y: auto; }
#title.on { display: flex; }
#title h1 { font-family: var(--display); font-size: clamp(2.4rem, 10vw, 4rem); margin: 0; letter-spacing: .08em; color: var(--sea); text-shadow: 0 4px 0 #fff; line-height: 1.1; }
#title p { margin: 0; max-width: 28em; line-height: 1.6; }
#title input { font: inherit; font-size: 1.1rem; text-align: center; padding: 10px; border-radius: 14px; border: 3px solid var(--sea); width: 12em; background: #fff; color: var(--ink); }
.hats { display: flex; gap: 10px; }
.hats button { width: 46px; height: 46px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,.2); }
.hats button.on { border-color: var(--sea); transform: scale(1.12); }
#toasts { position: absolute; left: 50%; transform: translateX(-50%); top: max(6px, env(safe-area-inset-top, 0px)); z-index: 20; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; z-index: 5; width: min(420px, 92%); }
.toast { background: var(--sea); color: #fff; border-radius: 14px; padding: 8px 14px; font-weight: 700; box-shadow: 0 3px 0 rgba(0,0,0,.25); animation: tin .25s ease-out; text-align: center; }
.toast.badge { background: var(--coin); color: var(--sea); } .toast.level, .toast.dream { background: var(--mint); }
@keyframes tin { from { transform: translateY(-14px) scale(.9); opacity: 0; } }
@media (max-width: 520px) { .chip small { display: none; } .chip { padding: 4px 8px; min-height: 36px; }  .act { min-width: 54px; padding: 6px 7px 5px; font-size: .76rem; } .act small { display: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="3D 小島，可以拖曳旋轉、點建築"></canvas>
  <div id="pins"></div>
  <div id="hud" class="pad" hidden>
    <div class="hudrow">
      <div class="chip date" id="h-date"><b>第1月</b><small>春</small></div>
      <div class="chip" title="現金"><span class="coin"></span><div><b id="h-cash">0</b><small>現金</small></div></div>
      <div class="chip" title="銀行存款"><span class="coin b"></span><div><b id="h-bank">0</b><small>存款</small></div></div>
      <div class="chip" title="總財產"><span class="coin n"></span><div><b id="h-net">0</b><small>總財產</small></div></div>
    </div>
    <div class="hudrow">
      <button class="chip me" id="h-me" aria-label="看角色和徽章"><span class="hero-av" id="h-av"></span><div><b id="h-lv" style="font-size:.95rem"></b><div class="bar"><i id="h-k"></i></div></div></button>
      <div class="chip"><div><small style="display:block">行動力</small><div class="ap" id="h-ap"></div></div></div>
      <div class="chip"><div><small style="display:block">心情</small><div class="bar joy"><i id="h-joy"></i></div></div></div>
      <button class="chip" id="h-mute" aria-label="音效開關" style="min-width:40px;justify-content:center">音</button>
    </div>
    <div id="tipbar"><span class="owl">貓</span><span id="tip"></span></div>
  </div>
  <div id="dock" class="pad" hidden></div>
  <div id="toasts"></div>
  <div id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div id="title" class="on">
    <h1>小小財富島</h1>
    <p>你是島上的小店長！開店賺錢、存錢、投資、完成夢想。24 個月後，看看你成為哪一種理財高手。</p>
    <input id="nm" maxlength="8" placeholder="替你的店長取名字" value="" aria-label="店長名字">
    <div class="hats" id="hats" role="radiogroup" aria-label="選擇帽子顏色"></div>
    <div class="row" style="justify-content:center"><button class="btn coin2" id="go">開始冒險</button><button class="btn" id="cont" hidden>繼續上次的遊戲</button></div>
    <small class="sub">遊戲約 20 到 30 分鐘。拖曳可旋轉小島，點建築就能操作。</small>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

function lessonById(id) { for (var i = 0; i < LESSONS.length; i++) if (LESSONS[i].id === id) return LESSONS[i]; return null; }

/* ---------- 狀態 ---------- */
function newGame(name, hat) {
  S = {
    v: 1, name: (name || '小店長').slice(0, 8), hat: hat | 0, m: 0, ap: 3, cash: 200, bank: 0, loan: 0, k: 0, joy: 70,
    shops: {}, inv: { fund: { u: 0, c: 0 }, stock: { u: 0, c: 0 }, land: { u: 0, c: 0 } },
    px: { fund: [100], stock: [100], land: [100] },
    dreams: { bike: false, tree: false, wheel: false },
    seen: [], badges: {}, toasts: [], pending: [],
    st: { interest: 0, forced: 0, scamLost: 0, scamRefused: 0, fees: 0, trades: 0, panic: false, earned: 0, realized: 0, evHist: [], minLiquid: 9999 },
    mods: { shop: 1, cost: 1, comp: false, rate: BANK_RATE, rateUntil: -1, rebound: 0, hustle: 0 },
    eventId: null, eventStage: 0, eventResult: null, eventNote: null, over: false, history: [200]
  };
  SHOP_ORDER.forEach(function (id) { S.shops[id] = { lv: 0, price: 1, staff: false, spent: 0 }; });
  return S;
}
function load(obj) { S = obj; S.toasts = []; return S; }
function state() { return S; }

function px(id) { var a = S.px[id]; return a[a.length - 1]; }
function holdVal(id) { return S.inv[id].u * px(id); }
function investValue() { return holdVal('fund') + holdVal('stock') + holdVal('land'); }
function shopAssets() { var t = 0; for (var id in S.shops) t += S.shops[id].spent * 0.6; return t; }
function netWorth() { return S.cash + S.bank + investValue() + shopAssets() - S.loan; }
function level() { var l = 1; for (var i = 1; i < LV_K.length; i++) if (S.k >= LV_K[i]) l = i + 1; return l; }
function joyF() { return S.joy >= 70 ? 1.08 : S.joy >= 40 ? 1 : S.joy >= 20 ? 0.9 : 0.8; }
function anyShop() { for (var id in S.shops) if (S.shops[id].lv) return true; return false; }
function allBuilt() { for (var id in S.shops) if (!S.shops[id].lv) return false; return true; }
function shopCount() { var n = 0; for (var id in S.shops) if (S.shops[id].lv) n++; return n; }
function toast(msg, type) { S.toasts.push({ msg: msg, type: type || 'info' }); }
function flush() { var t = S.toasts; S.toasts = []; return t; }
function award(id) { if (S.badges[id]) return false; S.badges[id] = S.m + 1; toast('獲得徽章「' + BADGES[id][0] + '」！', 'badge'); return true; }
function addK(n) {
  var before = level(); S.k += n; var after = level();
  if (after > before) { toast('升級了！你現在是「' + LV_TITLES[after - 1] + '」', 'level'); S.lvUp = after; }
  if (S.k >= 12) award('scholar');
}
function checkBadges() {
  if (S.bank >= 200) award('saver');
  if (S.st.interest >= 20) award('snowball');
  var held = (S.bank >= 30 ? 1 : 0) + (holdVal('fund') >= 30 ? 1 : 0) + (holdVal('stock') >= 30 ? 1 : 0) + (holdVal('land') >= 30 ? 1 : 0);
  if (held >= 3) award('diver');
  if (anyShop()) award('firstShop');
  if (allBuilt()) award('boss');
  if (netWorth() >= 1000) award('rich');
  if (S.dreams.bike || S.dreams.tree || S.dreams.wheel) award('dreamer');
}

/* 付錢：先現金、再存款、不夠就被迫借款 */
function pay(amt) {
  var r = { cash: 0, bank: 0, loan: 0 }, need = amt, c = Math.min(S.cash, need);
  S.cash -= c; need -= c; r.cash = c;
  var b = Math.min(S.bank, need); S.bank -= b; need -= b; r.bank = b;
  if (need > 0) { S.loan += need; r.loan = need; S.st.forced++; }
  return r;
}
function payNoLoan(amt) { var c = Math.min(S.cash, amt); S.cash -= c; var b = Math.min(S.bank, amt - c); S.bank -= b; return c + b; }

/* ---------- 店舖 ---------- */
function shopCalc(id, opt) {
  opt = opt || {};
  var D = SHOP[id], s = S.shops[id], lv = opt.lv || s.lv; if (!lv) return null;
  var pi = opt.price != null ? opt.price : s.price, staff = opt.staff != null ? opt.staff : s.staff;
  var tierP = [Math.round(D.price * 0.7), D.price, Math.round(D.price * 1.4)][pi];
  var dem = [1.45, 1, S.mods.comp ? 0.3 : 0.5][pi];
  var cust = D.cust * LVM[lv - 1] * D.season[seasonIdx(S.m)] * dem * S.mods.shop * joyF() * (1 + Math.min(S.k, 15) * 0.012) * (1 + S.mods.hustle) * (staff ? 1.25 : 1);
  if (opt.noise) cust *= 0.9 + R() * 0.2;
  cust = Math.round(cust);
  var unit = D.cost * S.mods.cost, rev = cust * tierP, goods = cust * unit, wage = staff ? D.wage : 0;
  return { price: tierP, cust: cust, revenue: Math.round(rev), goods: Math.round(goods), wage: wage, profit: Math.round(rev - goods - wage), unit: r2(unit) };
}
function build(id) {
  var D = SHOP[id], s = S.shops[id];
  if (level() < D.unlock) return no('還沒解鎖，先多學習升級吧！');
  if (s.lv) return no('已經蓋好了');
  if (S.cash < D.build) return no('現金不夠');
  S.cash -= D.build; s.lv = 1; s.spent += D.build; checkBadges();
  return yes(D.name + '開張了！');
}
function upgrade(id) {
  var D = SHOP[id], s = S.shops[id];
  if (!s.lv) return no('還沒蓋好');
  if (s.lv >= 3) return no('已經是最高等級');
  var c = D.up[s.lv - 1]; if (S.cash < c) return no('現金不夠');
  S.cash -= c; s.lv++; s.spent += c; checkBadges();
  return yes(D.name + '升到 Lv' + s.lv + '！');
}
function upgradeCost(id) { var s = S.shops[id]; return s.lv && s.lv < 3 ? SHOP[id].up[s.lv - 1] : 0; }
function setPrice(id, i) { S.shops[id].price = i; }
function toggleStaff(id) { S.shops[id].staff = !S.shops[id].staff; return S.shops[id].staff; }

/* ---------- 銀行 ---------- */
function deposit(a) { a = Math.min(a, S.cash); if (a <= 0) return no('現金不夠'); S.cash -= a; S.bank += a; checkBadges(); return yes('存入 ' + Math.round(a) + ' 金幣'); }
function withdraw(a) { a = Math.min(a, S.bank); if (a <= 0) return no('存款不夠'); S.bank -= a; S.cash += a; return yes('領出 ' + Math.round(a) + ' 金幣'); }
function borrow(a) { a = Math.min(a, LOAN_MAX - S.loan); if (a <= 0) return no('借款已經到上限了'); S.loan += a; S.cash += a; return yes('借了 ' + a + ' 金幣，每個月要付利息喔'); }
function repay(a) { a = Math.min(a, S.cash, S.loan); if (a <= 0) return no(S.loan <= 0 ? '你沒有借款' : '現金不夠'); S.cash -= a; S.loan -= a; return yes('還了 ' + Math.round(a) + ' 金幣'); }

/* ---------- 投資 ---------- */
function unlocked(id) { return level() >= ASSET[id].unlock; }
function buy(id, amt) {
  var A = ASSET[id]; if (!unlocked(id)) return no('還沒解鎖');
  amt = Math.min(amt, S.cash); if (amt < 1) return no('現金不夠');
  var fee = amt * A.fee, units = (amt - fee) / px(id);
  S.cash -= amt; S.inv[id].u += units; S.inv[id].c += amt; S.st.fees += fee; S.st.trades++; checkBadges();
  return yes('買進 ' + Math.round(amt) + ' 金幣，手續費 ' + r2(fee), { fee: fee });
}
function sell(id, frac) {
  var A = ASSET[id], h = S.inv[id]; if (h.u <= 0) return no('你沒有持有');
  var u = h.u * frac, value = u * px(id), fee = value * A.fee, got = value - fee;
  S.st.realized += got - h.c * frac; S.cash += got; h.u -= u; h.c *= (1 - frac); if (h.u < 1e-9) { h.u = 0; h.c = 0; }
  S.st.fees += fee; S.st.trades++;
  return yes('賣出，拿回 ' + Math.round(got) + ' 金幣，手續費 ' + r2(fee), { got: got });
}

/* ---------- 行動力 ---------- */
function studyBegin() {
  if (S.ap < 1) return null;
  var left = LESSONS.filter(function (l) { return S.seen.indexOf(l.id) < 0; });
  if (!left.length) { S.seen = []; left = LESSONS.slice(); }
  return left[Math.floor(R() * left.length)];
}
function studyAnswer(id, i) {
  var L = lessonById(id), ok = i === L.a; S.ap--; S.seen.push(id); S.joy = clamp(S.joy - 2, 0, 100);
  addK(ok ? 2 : 1); return { ok: ok, why: L.why };
}
function rest() { if (S.ap < 1) return no('這個月的行動力用完了'); S.ap--; S.joy = clamp(S.joy + 18, 0, 100); return yes('玩得好開心！心情 +18'); }
function work() {
  if (S.ap < 1) return no('這個月的行動力用完了');
  if (!anyShop()) return no('先蓋一家店才能顧店');
  if (S.mods.hustle >= 0.16) return no('已經很努力了，店裡人手夠了');
  S.ap--; S.mods.hustle = r2(S.mods.hustle + 0.08); S.joy = clamp(S.joy - 3, 0, 100);
  return yes('親自顧店！本月所有店的客人 +8%');
}
function buyDream(id) {
  var D = DREAMS[id]; if (S.dreams[id]) return no('已經實現了');
  if (S.cash < D.cost) return no('現金不夠');
  S.cash -= D.cost; S.dreams[id] = true; S.joy = clamp(S.joy + D.joy, 0, 100); checkBadges();
  toast('夢想成真：' + D.name + '！', 'dream'); return yes(D.name + '實現了！心情 +' + D.joy);
}

  if (muted) return; try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)(); var o = audio.createOscillator(), g = audio.createGain();
    o.type = type || 'sine'; o.frequency.value = f; g.gain.value = v || 0.06; g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + d);
    o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + d);
  } catch (e) {}
}
function sfx(k) { if (k === 'coin') { beep(880, .09); setTimeout(function () { beep(1320, .14); }, 70); } else if (k === 'bad') { beep(220, .25, 'triangle'); } else if (k === 'win') { [523, 659, 784, 1047].forEach(function (f, i) { setTimeout(function () { beep(f, .2); }, i * 110); }); } else beep(660, .06, 'triangle', .04); }

function spark(a) {
  var v = a.slice(-14), mn = Math.min.apply(0, v), mx = Math.max.apply(0, v), w = 200, h = 44, pad = 4, rg = mx - mn || 1;
  var pts = v.map(function (x, i) { return (i / Math.max(1, v.length - 1) * (w - 2 * pad) + pad).toFixed(1) + ',' + (h - pad - (x - mn) / rg * (h - 2 * pad)).toFixed(1); }).join(' ');
  var up = v[v.length - 1] >= v[0];
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" role="img" aria-label="最近價格走勢"><polyline points="' + pts + '" fill="none" stroke="' + (up ? '#1F9D5C' : '#D9453A') + '" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';
}

function startStudy() {
  var L = G.studyBegin(); if (!L) return say('行動力用完了', false);
  showSheet('<h2>' + esc(L.title) + '</h2><p>' + esc(L.text) + '</p><div class="row" style="margin-top:12px"><button class="btn coin2" id="qgo">考考我</button></div>', true, true);
  $('#qgo').onclick = function () { sfx(); quiz(L); };
}
function quiz(L) {
  var order = [0, 1, 2].sort(function () { return Math.random() - .5; });
  showSheet('<h2>' + esc(L.q) + '</h2>' + order.map(function (k) { return '<button class="opt" data-k="' + k + '">' + esc(L.o[k]) + '</button>'; }).join('') + '<div id="qfb"></div>', true, true);
  sheet.onclick = function (e) {
    var b = e.target.closest('.opt'); if (!b || b.disabled) return; var k = parseInt(b.getAttribute('data-k'), 10), r = G.studyAnswer(L.id, k);
    [].forEach.call(sheet.querySelectorAll('.opt'), function (o) { o.disabled = true; var kk = parseInt(o.getAttribute('data-k'), 10); if (kk === L.a) o.classList.add('right'); else if (kk === k) o.classList.add('wrong'); });
    sfx(r.ok ? 'coin' : 'bad');
    $('#qfb').innerHTML = '<div class="know"><b>' + (r.ok ? '答對了！知識 +2' : '差一點！知識 +1') + '</b>' + esc(r.why) + '</div><div class="row" style="margin-top:12px"><button class="btn coin2" id="qdone">好的</button></div>';
    toasts(); save(); refresh(); $('#qdone').focus();
    $('#qdone').onclick = function () { sheet.onclick = null; closeSheet(); if (S0().lvUp) levelUp(); };
  };
}
function S0() { return G.state(); }
function levelUp() {
  var S = G.state(), lv = S.lvUp; S.lvUp = 0; var un = [];
  G.SHOP_ORDER.forEach(function (id) { if (G.SHOP[id].unlock === lv) un.push(G.SHOP[id].name); }); G.ASSET_ORDER.forEach(function (id) { if (G.ASSET[id].unlock === lv) un.push(G.ASSET[id].name); });
  sfx('win'); showSheet('<h2>升級了！</h2><p style="font-size:1.2rem"><b>' + esc(S.name) + '</b> 現在是「' + G.LV_TITLES[lv - 1] + '」！</p>' + (un.length ? '<div class="know"><b>新解鎖</b>' + un.map(esc).join('、') + '</div>' : '') + '<div class="row" style="margin-top:12px"><button class="btn coin2" id="lvok">太棒了</button></div>', true, true);
  $('#lvok').onclick = function () { closeSheet(); };
}

/* ---- 結束這個月 ---- */
function confirmEnd() {
  var S = G.state(), warn = '';
  if (S.ap > 0) warn += '<p class="sub">還有 ' + S.ap + ' 點行動力沒用，結束後就浪費了。</p>';
  if (!G.anyShop()) warn += '<p class="neg"><b>你還沒有蓋店，這個月不會有收入喔。</b></p>';
  showSheet('<h2>結束第 ' + (S.m + 1) + ' 個月？</h2>' + warn + '<div class="row" style="margin-top:12px"><button class="btn red" id="endgo">結算！</button><button class="btn ghost" id="endno">再想想</button></div>', true);
  $('#endno').onclick = closeSheet; $('#endgo').onclick = doEnd;
}
function doEnd() {
  var r = G.endMonth(); toasts(); save(); closeSheet(); sfx('coin');
  var h = '<h2>第 ' + (r.m + 1) + ' 個月結算</h2>';
  if (r.shops.length) { h += '<div class="card"><table class="t">'; r.shops.forEach(function (c) { h += '<tr><td>' + esc(G.SHOP[c.id].name) + '（' + c.cust + ' 位客人）</td><td class="' + cl(c.profit) + '">' + sgn(c.profit) + '</td></tr>'; }); h += '<tr class="total"><td>店舖利潤合計</td><td class="' + cl(r.profit) + '">' + sgn(r.profit) + '</td></tr></table></div>'; } else h += '<p class="sub">這個月沒有店舖收入。</p>';
  h += '<div class="card" style="margin-top:8px"><table class="t"><tr><td>存款利息</td><td class="pos">+' + r.bankInt.toFixed(1) + '</td></tr>' + (r.loanInt > 0 ? '<tr><td>借款利息</td><td class="neg">−' + r.loanInt.toFixed(1) + '</td></tr>' : '') + '</table></div>';
  var S = G.state(); if (S.inv.fund.u + S.inv.stock.u + S.inv.land.u > 0) { h += '<h3>市場變化</h3><div class="card"><table class="t">'; G.ASSET_ORDER.forEach(function (id) { if (S.inv[id].u > 0) h += '<tr><td>' + esc(G.ASSET[id].name) + '</td><td class="' + cl(r.moves[id]) + '">' + (r.moves[id] >= 0 ? '▲ ' : '▼ ') + Math.abs(r.moves[id] * 100).toFixed(1) + '%</td></tr>'; }); h += '</table></div>'; }
  r.pend.forEach(function (m) { h += '<div class="know">' + esc(m) + '</div>'; }); r.notes.forEach(function (m) { h += '<div class="know" style="background:#FBE0DC">' + esc(m) + '</div>'; });
  var dn = r.net1 - r.net0; h += '<p style="margin-top:10px">總財產 <b>' + n0(r.net0) + '</b> → <b>' + n0(r.net1) + '</b> <b class="' + cl(dn) + '">（' + sgn(dn) + '）</b></p><div class="row" style="margin-top:12px"><button class="btn coin2" id="rnext">' + (S.over ? '看結果' : '下個月') + '</button></div>';
  showSheet(h, true, true); $('#rnext').onclick = function () { veil.className = ''; if (S.over) return ending(); afterMonth(); };
}
function afterMonth() { closeSheet(); refresh(); showEvent(); }
function showEvent() {
  var ev = G.eventView(); if (!ev) { toasts(); return; }
  var head = '<div class="row" style="gap:12px;margin-bottom:6px"><span class="ico ' + (ICLS[ev.icon] || '') + '">' + (ICON[ev.icon] || ICON.gift) + '</span><h2 style="margin:0">' + esc(ev.title) + '</h2></div><p>' + esc(ev.text) + '</p>';
  if (ev.note && ev.stage === 0) head += '<p class="sub">' + esc(ev.note) + '</p>';
  if (ev.stage === 0) {
    sfx(ev.icon === 'storm' || ev.icon === 'down' || ev.icon === 'alert' ? 'bad' : 'coin');
    showSheet(head + ev.choices.map(function (c, i) { return '<button class="opt" data-c="' + i + '" ' + (c.disabled ? 'disabled' : '') + '>' + esc(c.label) + '<small>' + esc(c.disabled || c.sub) + '</small></button>'; }).join(''), true, true);
    sheet.onclick = function (e) { var b = e.target.closest('[data-c]'); if (!b || b.disabled) return; sheet.onclick = null; G.choose(parseInt(b.getAttribute('data-c'), 10)); toasts(); save(); refresh(); showEvent(); };
  } else {
    if (ev.result) head += '<div class="card" style="margin:8px 0">' + esc(ev.result) + '</div>'; else if (ev.note) head += '<div class="card" style="margin:8px 0">' + esc(ev.note) + '</div>';
    showSheet(head + '<div class="know"><b>小知識</b>' + esc(ev.lesson) + '</div><div class="row" style="margin-top:12px"><button class="btn coin2" id="evok">知道了</button></div>', true, true);
    sfx(ev.icon === 'storm' || ev.icon === 'down' || ev.icon === 'alert' ? 'bad' : 'coin');
    $('#evok').onclick = function () { G.closeEvent(); toasts(); save(); closeSheet(); refresh(); };
  }
}

/* ---- 結局 ---- */
function lineChart(h) {
  var w = 320, ht = 120, p = 10, mx = Math.max.apply(0, h), mn = Math.min.apply(0, h, 0), rg = (mx - mn) || 1;
  var pts = h.map(function (v, i) { return (p + i / (h.length - 1) * (w - 2 * p)).toFixed(1) + ',' + (ht - p - (v - mn) / rg * (ht - 2 * p)).toFixed(1); }).join(' ');
  return '<svg viewBox="0 0 ' + w + ' ' + ht + '" style="width:100%;height:auto" role="img" aria-label="總財產變化"><rect x="0" y="0" width="' + w + '" height="' + ht + '" rx="12" fill="#EAF7F5"/><polyline points="' + pts + '" fill="none" stroke="#12343B" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><text x="' + (w - p) + '" y="' + (p + 10) + '" text-anchor="end" font-size="12" fill="#4A6A70">最高 ' + n0(mx) + '</text></svg>';
}
function ending() {
  var S = G.state(); S.over = true; save(); var R = G.finalReport(); sfx('win');
  var h = '<h2>24 個月結束！</h2><div style="text-align:center;margin:8px 0"><div class="sub">你的稱號</div><div style="font-family:var(--display);font-size:2rem;line-height:1.2">' + R.grade + '</div><div class="stars" style="font-size:1.3rem">' + R.total + ' / ' + R.max + ' 顆星</div><p>總財產 <b>' + n0(R.net) + '</b> 金幣</p></div>';
  h += '<div class="card"><table class="t">' + R.cat.map(function (c) { return '<tr><td>' + c.name + '<div class="sub">' + esc(c.note) + '</div></td><td>' + starsHtml(c.stars) + '</td></tr>'; }).join('') + '</table></div>';
  h += '<h3>你的理財性格：' + R.style.name + '</h3><p>' + esc(R.style.desc) + '</p>';
  h += '<h3>財產變化</h3>' + lineChart(R.history);
  h += '<h3>給下次的小提醒</h3>' + R.lines.map(function (l) { return '<div class="know" style="margin:6px 0">' + esc(l) + '</div>'; }).join('');
  h += '<h3>得到的徽章（' + R.badges.length + '）</h3><p>' + (R.badges.length ? R.badges.map(function (k) { return '<b>' + G.BADGES[k][0] + '</b>'; }).join('、') : '這次沒有拿到徽章，下次再努力！') + '</p>';
  h += '<div class="row" style="margin-top:14px"><button class="btn coin2" id="again">再玩一次</button><button class="btn ghost" id="keep">回島上看看</button></div>';
  showSheet(h, true, true); $('#again').onclick = function () { closeSheet(); toTitle(); }; $('#keep').onclick = function () { closeSheet(); $('#dock').hidden = true; $('#tip').textContent = '遊戲結束了，想再玩的話，點上方角色選「重新開始」。'; };
}
function confirmRestart() { showSheet('<h2>重新開始？</h2><p>目前的進度會被清除喔。</p><div class="row"><button class="btn red" id="rs1">重新開始</button><button class="btn ghost" id="rs2">取消</button></div>', true); $('#rs2').onclick = closeSheet; $('#rs1').onclick = function () { clearSave(); closeSheet(); toTitle(); }; }

/* ---- 標題與開始 ---- */
function hatsUi() { var h = $('#hats'); h.innerHTML = ''; G.HATS.forEach(function (c, i) { var b = document.createElement('button'); b.style.background = c.color; b.className = i === selHat ? 'on' : ''; b.setAttribute('aria-label', c.name); b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', i === selHat); b.onclick = function () { selHat = i; hatsUi(); }; h.appendChild(b); }); }
function toTitle() { $('#title').classList.add('on'); $('#hud').hidden = true; $('#dock').hidden = true; $('#pins').style.display = 'none'; $('#cont').hidden = !loadSave(); }
function enter() {
  $('#title').classList.remove('on'); $('#hud').hidden = false; $('#dock').hidden = false; $('#pins').style.display = ''; refresh();
  if (World.ok) World.focus('home'); save();
  if (G.eventView() && G.state().m > 0) showEvent();
  else if (G.state().m === 0 && !G.anyShop()) intro();
}
function intro() {
  showSheet('<h2>歡迎，' + esc(G.state().name) + '店長！</h2><p>這座小島有 4 塊空地，你要在 24 個月內，把它變成最棒的商店街。</p><div class="know"><b>每個月你有 3 點行動力</b>可以「學習」（升級、解鎖新東西）、「玩耍」（心情好，生意也好）、「顧店」（客人變多）。做完之後，按「結束這個月」。</div><div class="know"><b>先做這件事</b>點島上亮黃色的「蓋檸檬水攤」，開你的第一家店。</div><div class="row" style="margin-top:12px"><button class="btn coin2" id="iok">出發！</button></div>', true, true);
  $('#iok').onclick = closeSheet;
}
$('#go').onclick = function () { sfx(); var nm = $('#nm').value.trim() || '小店長'; clearSave(); G.newGame(nm, selHat); enter(); };
$('#cont').onclick = function () { var s = loadSave(); if (!s) return; G.load(s); selHat = s.hat; enter(); if (s.over) ending(); };

/* ---- 啟動 ---- */
G.newGame('小店長', 0); hatsUi(); pinsInit();
var ok = false; try { ok = World.init($('#scene'), pick); } catch (e) { ok = false; }
if (ok) { World.onFrame = pinsFrame; } else { document.body.classList.add('flat'); $('#scene').style.display = 'none'; }
$('#pins').style.display = 'none'; $('#cont').hidden = !loadSave();
})();
</script>

</body>
</html>
